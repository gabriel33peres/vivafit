<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VivaFit Web | Alunos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="alunos">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="dashboard.html" aria-label="VivaFit - Dashboard">
        <span class="brand-icon" aria-hidden="true">VF</span>
        <span>VivaFit</span>
      </a>
      <nav class="nav-menu" aria-label="Menu principal">
        <a href="dashboard.html">Dashboard</a>
        <a class="active" href="alunos.html">Alunos</a>
        <a href="planos.html">Planos</a>
        <a href="matriculas.html">Matrículas</a>
      </nav>
      <button id="logout-button" class="button button-ghost sidebar-logout" type="button">Sair</button>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div><p class="eyebrow">Gestão</p><h1>Alunos</h1></div>
        <button id="mobile-logout" class="button button-outline" type="button">Sair</button>
      </header>

      <div id="page-message" class="message" role="alert"></div>

      <section class="content-card" aria-labelledby="add-student-title">
        <div class="section-heading">
          <div><p class="eyebrow">Novo cadastro</p><h2 id="add-student-title">Adicionar aluno</h2></div>
        </div>
        <form id="aluno-form" class="form-grid form-grid-wide">
          <div class="form-field"><label for="nome">Nome</label><input id="nome" name="nome" required></div>
          <div class="form-field"><label for="cpf">CPF</label><input id="cpf" name="cpf" required></div>
          <div class="form-field"><label for="aluno-email">E-mail</label><input id="aluno-email" name="email" type="email" required></div>
          <div class="form-field"><label for="telefone">Telefone</label><input id="telefone" name="telefone" required></div>
          <div class="form-field"><label for="dataNascimento">Data de nascimento</label><input id="dataNascimento" name="dataNascimento" type="date" required></div>
          <div class="form-actions"><button class="button button-primary" type="submit">Cadastrar aluno</button></div>
        </form>
      </section>

      <section class="content-card" aria-labelledby="students-title">
        <div class="section-heading">
          <div><p class="eyebrow">Cadastro</p><h2 id="students-title">Alunos cadastrados</h2></div>
          <button id="refresh-alunos" class="button button-outline" type="button">Atualizar</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Nome</th><th>CPF</th><th>E-mail</th><th>Telefone</th><th>Status</th><th>Ações</th></tr></thead>
            <tbody id="alunos-table"><tr><td colspan="6" class="empty-state">Carregando alunos...</td></tr></tbody>
          </table>
        </div>
      </section>

      <footer class="site-footer">VivaFit Web · Projeto acadêmico PIM IV</footer>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/alunos.js"></script>
</body>
</html>
