<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VivaFit Web | Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="login-title">
    <div class="brand-mark" aria-hidden="true">VF</div>
    <p class="eyebrow">ACADEMIA</p>
    <h1 id="login-title">VivaFit <span>Academia</span></h1>
    <p class="muted">Acesse o painel de gestão da academia.</p>

    <form id="login-form" class="form-grid">
      <div class="form-field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="form-field">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      </div>
      <button class="button button-primary" type="submit">Entrar</button>
    </form>

    <p id="login-message" class="message" role="alert"></p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
